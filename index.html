<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="build" content="__BUILD__">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dungeon RO</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#07060a">
  <!-- iOS ignores the manifest for installs and reads these instead. Without the
       apple-touch-icon it puts a screenshot of the page on the home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dungeon RO">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <main id="frame">
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div id="status">
        <div id="hero-badge"><span id="hero-name">Knight</span><span id="hero-lv">Lv 1</span></div>
        <div class="bars">
          <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text" class="text"></span></div>
          <div class="bar mp"><div id="mp-fill" class="fill"></div><span id="mp-text" class="text"></span></div>
          <div class="bar xp" id="xp-bar"><div id="xp-fill" class="fill"></div></div>
        </div>
      </div>
      <div id="room">
        <div id="room-name"></div>
        <div id="room-wave"></div>
      </div>
      <div id="score">
        <div id="score-value">0</div>
        <div id="combo"><span id="combo-count">0</span><span class="label">HITS</span></div>
      </div>
      <div id="boss" hidden>
        <div id="boss-name"></div>
        <div class="bar boss"><div id="boss-fill" class="fill"></div></div>
      </div>
      <div id="go" hidden>GO <span>▶</span></div>
      <div id="banner" hidden></div>
      <div id="skills"></div>
      <div id="hint"></div>
    </div>

    <div id="title" class="overlay">
      <h1>Dungeon <span>RO</span></h1>
      <p class="sub" id="title-sub">Culvert of Prontera — five rooms, one Baphomet.</p>
      <div id="heroes">
        <button class="hero" data-hero="knight" type="button">
          <strong>Knight <span class="lv"></span></strong>
          <em>Melee. Three-hit sword combo, Quicken Sword, Magnum Break, Bowling Bash. Passive: Soul Drain.</em>
        </button>
        <button class="hero" data-hero="hunter" type="button">
          <strong>Hunter <span class="lv"></span></strong>
          <em>Ranged. Arrow chain, Wind Walk, Arrow Shower, Blitz Beat. Passive: Auto Blitz.</em>
        </button>
      </div>
      <div class="row" id="profile-row">
        <button id="title-character" class="primary" type="button">Profile</button>
      </div>
      <div id="towns">
        <button class="town selected" data-town="prontera" type="button">
          <strong>Prontera</strong>
          <em>Culvert of Prontera — Baphomet</em>
        </button>
        <button class="town" data-town="morroc" type="button">
          <strong>Morroc</strong>
          <em>Sograt Desert — Phreeoni</em>
        </button>
      </div>
      <p class="controls" id="title-controls"></p>
      <button id="title-settings" class="ghost" type="button">Settings &amp; controls</button>
      <button id="title-soak" class="ghost" type="button">Soak test — endless waves, plays itself</button>
      <button id="title-install" class="ghost" type="button" hidden>Install on this device</button>
      <p id="install-hint" class="sub" hidden></p>
      <p id="loading">Loading heroes…</p>
    </div>

    <div id="end" class="overlay" hidden>
      <h1 id="end-title">Dungeon cleared</h1>
      <p id="end-stats"></p>
      <p id="end-progress"></p>
      <div class="row">
        <button id="end-continue" class="primary" type="button" hidden>Continue</button>
        <button id="retry" class="primary" type="button">Play again</button>
        <button id="end-home" class="ghost" type="button">Title</button>
      </div>
    </div>

    <div id="pause" class="overlay" hidden>
      <h1>Paused</h1>
      <p class="sub" id="pause-sub">Press P to resume</p>
      <div class="row">
        <button id="pause-resume" type="button">Resume</button>
        <button id="pause-profile" class="ghost" type="button">Profile</button>
        <button id="pause-settings" class="ghost" type="button">Settings &amp; controls</button>
      </div>
    </div>

    <div id="character" class="overlay" hidden>
      <div class="panel">
        <header>
          <h2 id="character-title">Profile</h2>
          <button id="character-close" class="x" type="button" aria-label="Close profile">✕</button>
        </header>
        <nav id="character-tabs">
          <button class="tab selected" data-tab="skills" type="button">Skills</button>
          <button class="tab" data-tab="equip" type="button">Equipment</button>
        </nav>
        <div id="character-body"></div>
        <footer>
          <p id="character-note"></p>
        </footer>
      </div>
    </div>

    <div id="settings" class="overlay" hidden>
      <div class="panel">
        <header>
          <h2>Settings</h2>
          <button id="settings-close" class="x" type="button" aria-label="Close settings">✕</button>
        </header>
        <nav id="settings-tabs">
          <button class="tab selected" data-tab="controls" type="button">Controls</button>
          <button class="tab" data-tab="touch" type="button">On-screen controls</button>
        </nav>
        <div id="settings-body"></div>
        <footer>
          <p id="settings-note"></p>
          <button id="settings-reset" class="ghost" type="button">Reset to defaults</button>
        </footer>
      </div>
    </div>

    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="stick"><div id="stick-knob"></div></div>
      <button id="tbtn-pause" class="tbtn sys" data-k="pause" data-edge="1" type="button" aria-label="Pause">❙❙</button>
      <div id="tbtns">
        <button class="tbtn s" data-k="skill1" type="button">U</button>
        <button class="tbtn s" data-k="skill2" type="button">I</button>
        <button class="tbtn s" data-k="skill3" type="button">O</button>
        <button class="tbtn" data-k="dash" type="button">DASH</button>
        <button class="tbtn" data-k="jump" type="button">JUMP</button>
        <button class="tbtn big" data-k="attack" type="button">ATK</button>
      </div>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
  <script type="module" src="src/install.js"></script>
  <script type="module" src="src/stats.js"></script>
</body>
</html>
