server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Three.js plus the module graph is most of the payload. GLBs are already compressed
  # binary, so they are deliberately left out of gzip.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # No `types` block here on purpose. It would shadow the stock mime.types include and
  # break .js, which ES modules do care about. .glb has no entry there and falls through
  # to application/octet-stream, which is fine: GLTFLoader reads an ArrayBuffer and never
  # inspects Content-Type.

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / { try_files $uri $uri/ =404; }

  # no-cache, not no-store: the browser and Cloudflare may keep a copy but must revalidate,
  # so an unchanged file costs a 304 and a changed one is picked up on the next request.
  #
  # max-age=3600 was wrong here. Filenames never change - there is no build step and so no
  # content hashes - so a cached style.css stayed stale at Cloudflare's edge for an hour
  # after a deploy while the Pi was already serving the new one. That is indistinguishable
  # from "the deploy did not work".
  location ~* \.(js|css|glb|png|jpg|json)$ { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
