apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ragnarok-n-dungeon

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Pinned by deploy.sh to an immutable commit-sha tag, so a rollback is a one-line revert.
images:
  - name: ghcr.io/totoland/ragnarok-n-dungeon
    newTag: sha-c9fb45eba4d3
