apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragnarok-n-dungeon
  # k3s ships Traefik as the default ingress controller.
  #
  # No TLS block and no cert-manager annotation, on purpose: this cluster has no
  # cert-manager. HTTPS terminates at Cloudflare's edge and reaches the Pi over a named
  # tunnel, so Traefik only ever sees plain HTTP.
  #
  # The one host is a private .internal name. The tunnel rule for the public hostname
  # points at http://localhost:80 on the node and sets httpHostHeader to this name, so the
  # public hostname - and the node's address - never appear in this repository. On the LAN:
  # curl -H "Host: ragnarok-lab.internal" http://<node>/
spec:
  ingressClassName: traefik
  rules:
    - host: ragnarok-lab.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ragnarok-n-dungeon
                port: { name: http }
