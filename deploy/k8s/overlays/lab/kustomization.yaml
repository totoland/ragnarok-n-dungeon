# Lab: ragnarok-lab.totoland.cloud. Every `deploy.sh` (no argument) builds and lands here
# first; one replica is plenty for a test bed and a broken build never touches prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ragnarok-n-dungeon-lab

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - target: { kind: Deployment, name: ragnarok-n-dungeon }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Pinned by deploy.sh to an immutable commit-sha tag.
images:
  - name: ghcr.io/totoland/ragnarok-n-dungeon
    newTag: sha-170186e08c9a
