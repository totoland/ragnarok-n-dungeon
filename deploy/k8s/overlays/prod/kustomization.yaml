# Production. Nothing lands here by a build - `deploy.sh prod` promotes the tag already
# proven on lab, so prod and lab run byte-identical images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ragnarok-n-dungeon

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

patches:
  - target: { kind: Deployment, name: ragnarok-n-dungeon }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: DRO_ENV, value: prod }

# Pinned by `deploy.sh prod` to an immutable commit-sha tag, so a rollback is a one-line revert.
images:
  - name: ghcr.io/totoland/ragnarok-n-dungeon
    newTag: sha-c69f2bb9ca29
